[project]
name = "ycc-hull"
version = "1.3.0"
description = "YCC Hull Backend Service"
authors = [
    { name = "Lajos Cseppentő", email = "1053931+LajosCseppento@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # General
    "aiofiles>=25.1.0",
    "lxml[html_clean]>=6.0.2",
    "phonenumbers>=9.0.26",
    "pyhumps>=3.8.0",
    "toml>=0.10.2",

    # Auth
    "python-keycloak>=7.1.1",

    # Notifications
    "aiosmtplib>=5.1.0",
    "APScheduler>=3.11.2",

    # REST API
    "fastapi>=0.135.1",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",

    # DB
    "oracledb>=3.4.2",
    "SQLAlchemy[asyncio]>=2.0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
start = "ycc_hull.main:main"

[dependency-groups]
dev = [
    "Faker>=40.11.0",
    "httpx>=0.28.1",
    "locust>=2.43.3",
    "passlib>=1.7.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.6",
    "sqlacodegen>=4.0.2",
    "ty>=0.0.23",
    "types-aiofiles>=25.1.0.20251011",
    "types-lxml>=2026.2.16",
    "types-passlib>=1.7.7.20260211",
    "types-requests>=2.32.4.20260107",
    "types-toml>=0.10.8.20240310",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ycc_hull", "test_data"]

[tool.pytest.ini_options]
addopts = "-ra --cov=ycc_hull --cov-branch --cov-report=term-missing"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff formatter
    "D105",   # magic methods don't need docstrings
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    # type-checking imports - not worth the complexity, plus it could risk Pydantic runtime behaviour
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"generated_entities/entities_generated.py" = [
    "D100",
    "D101",
    "E501",
    "FBT003",
    "INP001",
    "UP042",
]

"load_tests/**/*.py" = [
    "D100",    # no module docstrings needed in tests
    "D101",    # no class docstrings needed in tests
    "D103",    # no function docstrings needed in tests
    "D104",    # no package docstrings needed in tests
    "PLR2004", # magic values are fine in load tests
    "S101",    # assert is fine in load tests
]

"scripts/**/*.py" = [
    "INP001",
    "PLR2004", # magic values are fine in scripts
    "T201",    # print is fine in scripts
]

"test_data/**/*.py" = [
    "DTZ001",  # Time time zones needed for test data
    "DTZ002",  # Time time zones needed for test data
    "DTZ007",  # Time time zones needed for test data
    "DTZ011",  # Time time zones needed for test data
    "PLR2004", # magic values are fine in test data
]

"tests/**/*.py" = [
    "ANN201",  # no return type annotations needed in tests
    "D100",    # no module docstrings needed in tests
    "D101",    # no class docstrings needed in tests
    "D103",    # no function docstrings needed in tests
    "D104",    # no package docstrings needed in tests
    "PLC0415", # local imports needed for patching
    "PLR2004", # magic values are fine in tests
    "S101",    # assert is fine in tests
]
